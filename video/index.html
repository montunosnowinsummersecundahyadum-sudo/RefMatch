<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RefMatch — Motion film</title><link rel="icon" type="image/svg+xml" href="../brand/logos/app-icon.svg"><link rel="stylesheet" href="../brand/theme.css">
  <style>
    body{min-height:100vh;display:grid;place-content:center;padding:24px;background:#05131b}
    main{width:min(1280px,calc(100vw - 48px))}canvas{width:100%;height:auto;display:block;aspect-ratio:16/9;border-radius:16px}
    .controls{display:flex;align-items:center;gap:20px;margin-top:20px}input{flex:1;accent-color:#b6f36a;min-width:40px}output{font-variant-numeric:tabular-nums;font-size:14px;min-width:80px}
    .note{margin-top:16px;font-size:12px;color:#aac1c8}a{color:#b6f36a}button[disabled]{opacity:.5;cursor:wait}
    body.render{padding:0;display:block;width:1920px;height:1080px;overflow:hidden}body.render main{width:1920px}body.render canvas{width:1920px;height:1080px;border-radius:0}body.render .controls,body.render .note{display:none}
  </style>
</head>
<body>
<main>
  <canvas id="film" width="1920" height="1080" role="img" aria-label="RefMatch explainer: profile a match, rank eligible referees, and explain the recommendation. All data is synthetic."></canvas>
  <div class="controls"><button class="rm-button" id="play" disabled>Play film</button><input aria-label="Video position" id="scrub" type="range" min="0" max="15" step="0.01" value="0"><output id="time">0.0 / 15 s</output><a href="refmatch-15s.mp4" download>MP4 ↓</a></div>
  <p class="note">Original motion graphics and sound design. Synthetic concept demonstration. <a href="../brand/">View the identity →</a></p>
  <audio id="sound" src="refmatch-soundtrack.wav" preload="auto"></audio>
</main>
<script type="module" src="./film.js"></script>
</body>
</html>
